name: Refactor
description: 코드 개선 및 리팩토링을 제안합니다.
title: "refactor: "
labels: ["refactor"]
body:
  - type: markdown
    attributes:
      value: |
        리팩토링 제안 감사합니다. 아래 항목을 작성해주세요.

  - type: textarea
    id: description
    attributes:
      label: 리팩토링 설명
      description: 어떤 부분을 개선하려고 하나요?
      placeholder: 리팩토링 대상과 이유를 입력하세요.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 필요한 이유
      description: 왜 이 리팩토링이 필요한지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 변경 범위
      description: 어떤 파일/컴포넌트가 영향을 받나요?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 참고할 자료가 있다면 첨부해주세요.
    validations:
      required: false

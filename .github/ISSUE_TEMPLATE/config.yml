# 빈 이슈를 허용한다.
# 템플릿 3종(bug_report / feature_request / refactor)은 버그·기능·리팩토링만 덮는다.
# 이 저장소는 GitHub Discussions 가 꺼져 있어서 질문이나 설계 논의를 보낼 곳이 따로 없다.
# 그래서 그런 글은 빈 이슈로 받는다. Discussions 를 켜면 이 값을 다시 판단한다.
blank_issues_enabled: true

# 실재하는 링크만 적는다. Discussions 는 꺼져 있으므로 넣지 않는다.

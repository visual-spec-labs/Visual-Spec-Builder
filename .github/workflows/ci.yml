name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines의 두 하한과 Node 24를 검사한다. Windows는 #262 반영 후 별도 통합한다.
        node: ['20.19.0', '22.12.0', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: 전체 테스트 (fresh tarball 설치 smoke 포함)
        run: pnpm test
      - name: Production build
        run: pnpm run build
      - name: 스키마 드리프트 검사
        run: |
          pnpm run generate:types
          if ! git diff --exit-code; then
            echo "::error::생성된 types.ts가 커밋된 내용과 다릅니다. 정본 스키마에서 pnpm run generate:types로 재생성하고 함께 커밋하세요."
            exit 1
          fi

  browser:
    name: Chromium / existing opt-in tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: 고정 Playwright와 해당 Chromium 설치
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          # 기존 Python fixture 두 개가 요구하는 경로를 같은 고정 브라우저로 연결한다.
          chromium_path="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$chromium_path"
          sudo ln -sf "$chromium_path" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: 기존 브라우저 검사 3개 명시 실행 (skip 금지)
        env:
          VSB_RESPONSIVE_BROWSER: '1'
          VSB_PAGE_SHELL_BROWSER: '1'
          VSB_GRID_BROWSER: '1'
          CHROME_BIN: /usr/bin/chromium
          BROWSER_REPORT: ${{ runner.temp }}/browser-results.json
        run: |
          pnpm exec vitest run \
            test/responsive-codegen-browser.test.ts \
            test/page-shell-browser.test.ts \
            test/grid-codegen-browser.test.ts \
            --reporter=default --reporter=json --outputFile="$BROWSER_REPORT"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(readFileSync(process.env.BROWSER_REPORT, 'utf8'));
          assert.equal(report.numTotalTests, 3);
          assert.equal(report.numPassedTests, 3);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.numFailedTests, 0);
          JS

  # 브랜치 보호의 기존 required check 이름을 유지한다.
  # 의존 잡 실패/취소/skip도 build 실패로 전파한다. Windows 통합 시 needs에 추가한다.
  build:
    name: build
    if: ${{ always() }}
    needs: [linux, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: 모든 필수 검사 성공 확인
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$LINUX_RESULT" = success && test "$BROWSER_RESULT" = success
